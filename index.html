<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SGX Story VisGen | Live Capture Core v10</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          colors: {
            sgxBlue: '#32527B',
            sgxYellow: '#FDCC0D',
            sgxCopper: '#B87333',
            sgxNeon: '#00ffff',
            sgxMagenta: '#ff00ff'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } 
        } 
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; color: white; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #root { width: 100%; height: 100%; }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; position: relative; z-index: 60; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #FDCC0D; cursor: pointer; margin-top: -4px; box-shadow: 0 0 6px rgba(253,204,13,0.8); }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #32527B; border-radius: 2px; }
    
    @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
    .comic-font { font-family: 'Bangers', cursive; letter-spacing: 2px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
        "lucide-react": "https://esm.sh/lucide-react@0.303.0?external=react"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useEffect, useRef, useState, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as THREE from 'three';
    import { Canvas, useFrame, useThree } from '@react-three/fiber';
    import { Settings2, Camera, PaintBucket, Grid, Scissors, Layers, Video, Square, Zap, Scan, MonitorPlay, Palette } from 'lucide-react';

    // ==========================================
    // SHADER ENGINE (Live Only - Stabilized)
    // ==========================================
    const ComicBackground = ({ videoElement, shaderParams }) => {
        const { size } = useThree();
        const materialRef = useRef();
        const [texture, setTexture] = useState(null);

        useEffect(() => {
            if (videoElement) {
                const tex = new THREE.VideoTexture(videoElement);
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                setTexture(tex);
                return () => tex.dispose();
            }
        }, [videoElement]);

        const uniforms = useMemo(() => ({
            tDiffuse: { value: null },
            uResolution: { value: new THREE.Vector2(1, 1) },
            uMediaResolution: { value: new THREE.Vector2(1, 1) },
            uMirror: { value: 1.0 },
            uTime: { value: 0.0 },
            uEdgeThreshold: { value: 0.15 },
            uColorSteps: { value: 5.0 },
            uSaturation: { value: 1.5 },
            uHue: { value: 0.0 }, 
            uDotScale: { value: 80.0 },
            uDotIntensity: { value: 0.5 },
            uBrightness: { value: 1.0 },
            uContrast: { value: 1.0 },
            uNoise: { value: 0.0 },
            uAberration: { value: 0.0 },
            uGlitchTearing: { value: 0.0 },
            uScanlines: { value: 0.0 }
        }), []);

        useFrame(({ clock }) => {
            if (materialRef.current && videoElement) {
                const u = materialRef.current.uniforms;
                u.uTime.value = clock.getElapsedTime();
                u.uResolution.value.set(size.width, size.height);
                u.uMediaResolution.value.set(videoElement.videoWidth || 1, videoElement.videoHeight || 1);
                u.tDiffuse.value = texture;

                u.uEdgeThreshold.value = 0.4 - (shaderParams.inkThickness * 0.35); 
                u.uColorSteps.value = shaderParams.colorSteps;
                u.uSaturation.value = shaderParams.saturation;
                u.uHue.value = shaderParams.hue;
                u.uDotScale.value = shaderParams.dotScale;
                u.uDotIntensity.value = shaderParams.dotIntensity;
                u.uBrightness.value = shaderParams.brightness;
                u.uContrast.value = shaderParams.contrast;
                u.uNoise.value = shaderParams.noise;
                u.uAberration.value = shaderParams.aberration;
                u.uGlitchTearing.value = shaderParams.glitchTearing;
                u.uScanlines.value = shaderParams.scanlines;
            }
        });

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform sampler2D tDiffuse;
            uniform vec2 uResolution;
            uniform vec2 uMediaResolution;
            uniform float uMirror;
            uniform float uTime;
            uniform float uEdgeThreshold;
            uniform float uColorSteps;
            uniform float uSaturation;
            uniform float uHue;
            uniform float uDotScale;
            uniform float uDotIntensity;
            uniform float uBrightness;
            uniform float uContrast;
            uniform float uNoise;
            uniform float uAberration;
            uniform float uGlitchTearing;
            uniform float uScanlines;

            varying vec2 vUv;

            float getLuma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
            float rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }

            vec3 applyHue(vec3 color, float hue) {
                const vec3 k = vec3(0.57735, 0.57735, 0.57735);
                float cosAngle = cos(hue);
                return color * cosAngle + cross(k, color) * sin(hue) + k * dot(k, color) * (1.0 - cosAngle);
            }

            void main() {
                vec2 screenRatio = vec2(uResolution.x / uResolution.y, 1.0);
                vec2 mediaRatio = vec2(uMediaResolution.x / uMediaResolution.y, 1.0);
                if (uResolution.x / uResolution.y < 1.0) {
                    screenRatio = vec2(1.0, uResolution.y / uResolution.x);
                    mediaRatio = vec2(1.0, uMediaResolution.y / uMediaResolution.x);
                }
                vec2 ratio = vec2(max(screenRatio.x / mediaRatio.x, 1.0), max(screenRatio.y / mediaRatio.y, 1.0));
                vec2 uv = (vUv - 0.5) * ratio + 0.5;

                if(uMirror > 0.5) { uv.x = 1.0 - uv.x; }

                if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
                    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                    return;
                }

                float glitchOffset = 0.0;
                if (uGlitchTearing > 0.0) {
                    float gTime = uTime * 15.0;
                    float band = step(0.9, sin(uv.y * 10.0 + gTime) * cos(uv.y * 25.0 - gTime));
                    glitchOffset = band * (rand(vec2(gTime, uv.y)) - 0.5) * 0.1 * uGlitchTearing;
                }
                vec2 baseUv = uv + vec2(glitchOffset, 0.0);

                vec2 rUv = baseUv + vec2(uAberration * 0.01, 0.0);
                vec2 gUv = baseUv;
                vec2 bUv = baseUv - vec2(uAberration * 0.01, 0.0);

                vec3 color;
                color.r = texture2D(tDiffuse, rUv).r;
                color.g = texture2D(tDiffuse, gUv).g;
                color.b = texture2D(tDiffuse, bUv).b;
                
                color = (color - 0.5) * uContrast + 0.5;
                color *= uBrightness;
                float luma = getLuma(color);
                color = mix(vec3(luma), color, uSaturation);
                color = applyHue(color, uHue);

                vec2 texel = 1.0 / uResolution;
                float s00 = getLuma(texture2D(tDiffuse, baseUv + texel * vec2(-1.0, -1.0)).rgb);
                float s22 = getLuma(texture2D(tDiffuse, baseUv + texel * vec2(1.0, 1.0)).rgb);
                float s02 = getLuma(texture2D(tDiffuse, baseUv + texel * vec2(-1.0, 1.0)).rgb);
                float s20 = getLuma(texture2D(tDiffuse, baseUv + texel * vec2(1.0, -1.0)).rgb);
                float edge = abs(s00 - s22) + abs(s02 - s20);
                float isEdge = smoothstep(uEdgeThreshold - 0.05, uEdgeThreshold, edge);

                vec3 postColor = floor(color * uColorSteps) / uColorSteps;
                vec2 gridUv = baseUv * vec2(uResolution.x / uResolution.y, 1.0) * uDotScale; 
                float dotMask = smoothstep((1.0 - luma) * 0.7, (1.0 - luma) * 0.7 + 0.1, length(fract(gridUv) - 0.5));

                float n = (rand(baseUv + uTime) - 0.5) * uNoise;
                float scanline = sin(uv.y * uResolution.y * 1.5) * 0.04 * uScanlines;

                vec3 finalColor = postColor + n - scanline;
                finalColor = mix(mix(vec3(0.05, 0.05, 0.1), finalColor, dotMask), finalColor, 1.0 - uDotIntensity);
                finalColor = mix(finalColor, vec3(0.02), isEdge); 

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        return (
            <mesh renderOrder={-1}>
                <planeGeometry args={[2, 2]} />
                <shaderMaterial 
                    ref={materialRef}
                    vertexShader={vertexShader}
                    fragmentShader={fragmentShader}
                    uniforms={uniforms}
                    depthWrite={false}
                    depthTest={false}
                />
            </mesh>
        );
    };

    // ==========================================
    // MAIN APP
    // ==========================================
    function App() {
        const videoRef = useRef(null);
        const [isReady, setIsReady] = useState(false);
        const [isMenuOpen, setIsMenuOpen] = useState(true);
        const [isRecording, setIsRecording] = useState(false);
        
        const audioStreamRef = useRef(null);
        const mediaRecorderRef = useRef(null);
        const recordedChunks = useRef([]);

        const [params, setParams] = useState({
            inkThickness: 0.8, colorSteps: 5.0, saturation: 1.5, hue: 0.0, 
            dotScale: 120.0, dotIntensity: 0.4, brightness: 1.0, contrast: 1.2, 
            noise: 0.1, aberration: 0.0, glitchTearing: 0.0, scanlines: 0.0
        });

        const presets = {
            comic: { inkThickness: 0.8, colorSteps: 5.0, saturation: 1.5, hue: 0.0, dotScale: 120.0, dotIntensity: 0.4, brightness: 1.0, contrast: 1.2, noise: 0.1, aberration: 0.0, glitchTearing: 0.0, scanlines: 0.0 },
            manga: { inkThickness: 0.9, colorSteps: 2.0, saturation: 0.0, hue: 0.0, dotScale: 150.0, dotIntensity: 0.8, brightness: 1.2, contrast: 1.5, noise: 0.2, aberration: 0.5, glitchTearing: 0.0, scanlines: 0.2 },
            cyberpunk: { inkThickness: 0.7, colorSteps: 8.0, saturation: 2.5, hue: 0.5, dotScale: 60.0, dotIntensity: 0.2, brightness: 0.9, contrast: 1.4, noise: 0.05, aberration: 2.0, glitchTearing: 0.8, scanlines: 1.0 },
            acid: { inkThickness: 0.4, colorSteps: 3.0, saturation: 3.0, hue: 3.14, dotScale: 40.0, dotIntensity: 0.6, brightness: 1.2, contrast: 2.0, noise: 0.3, aberration: 3.5, glitchTearing: 1.5, scanlines: 0.0 }
        };

        const updateParam = (key, value) => setParams(prev => ({ ...prev, [key]: Number(value) }));

        useEffect(() => {
            const startCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "user" },
                        audio: { echoCancellation: true, noiseSuppression: true } 
                    });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        audioStreamRef.current = stream; 
                        videoRef.current.onloadedmetadata = () => {
                            videoRef.current.play();
                            setIsReady(true);
                        };
                    }
                } catch (e) { console.error("Cam Access Denied", e); }
            };
            startCamera();
        }, []);

        const takeSnapshot = () => {
            const canvas = document.querySelector('canvas');
            if(!canvas) return;
            const link = document.createElement('a');
            link.download = `SGX_VisGen_Live_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        const toggleRecording = () => {
            const canvas = document.querySelector('canvas');
            if(!canvas || !audioStreamRef.current) return;

            if (!isRecording) {
                recordedChunks.current = [];
                const canvasStream = canvas.captureStream(30);
                const combinedStream = new MediaStream([
                    ...canvasStream.getVideoTracks(),
                    ...audioStreamRef.current.getAudioTracks()
                ]);

                let mimeType = 'video/mp4'; 
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm; codecs=vp9,opus';

                mediaRecorderRef.current = new MediaRecorder(combinedStream, { mimeType });
                mediaRecorderRef.current.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.current.push(e.data); };
                mediaRecorderRef.current.onstop = () => {
                    const blob = new Blob(recordedChunks.current, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = `SGX_VisGen_Live_${Date.now()}.mp4`;
                    link.href = url;
                    link.click();
                };
                mediaRecorderRef.current.start();
                setIsRecording(true);
            } else {
                mediaRecorderRef.current.stop();
                setIsRecording(false);
            }
        };

        return (
            <div className="relative w-full h-screen bg-black overflow-hidden font-sans">
                <video ref={videoRef} className="hidden" playsInline muted />
                
                <div className="absolute inset-0 z-0">
                    <Canvas gl={{ preserveDrawingBuffer: true, antialias: false, toneMapping: THREE.NoToneMapping }}>
                        {isReady && <ComicBackground videoElement={videoRef.current} shaderParams={params} />}
                    </Canvas>
                </div>

                {/* UI: HEADER */}
                <div className="absolute top-6 left-6 z-50 pointer-events-none">
                    <div className="flex items-center gap-3 bg-white p-3 border-4 border-black rounded-xl shadow-[4px_4px_0px_0px_#32527B] transform -rotate-1 pointer-events-auto">
                        <Layers className="text-black w-5 h-5" />
                        <div><h1 className="text-xl text-black comic-font leading-none uppercase tracking-tight">SGX <span className="text-[#B87333]">VisGen</span> Live</h1></div>
                    </div>
                </div>

                {/* UI: CAPTURA */}
                <div className="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-50 flex items-center gap-4 pointer-events-auto">
                    <button onClick={takeSnapshot} className="bg-white text-black p-4 rounded-full hover:scale-105 transition shadow-xl active:scale-95 outline-none">
                        <Camera className="w-6 h-6" />
                    </button>
                    <button onClick={toggleRecording} className={`p-4 rounded-full transition shadow-xl active:scale-95 outline-none ${isRecording ? 'bg-red-600 text-white animate-pulse' : 'bg-sgxMagenta text-white hover:bg-fuchsia-600'}`}>
                        {isRecording ? <Square className="w-6 h-6 fill-current" /> : <Video className="w-6 h-6 fill-current" />} 
                    </button>
                </div>

                {/* UI: CONSOLE */}
                <div className="absolute bottom-24 left-6 md:top-24 md:left-6 md:bottom-auto w-[calc(100%-3rem)] md:w-80 z-50 flex flex-col gap-2 pointer-events-auto">
                    <button 
                        onClick={() => setIsMenuOpen(!isMenuOpen)}
                        className="flex items-center justify-between bg-sgxYellow text-black border-2 border-black rounded-xl px-4 py-2 font-black uppercase text-xs tracking-widest shadow-[4px_4px_0px_0px_#B87333] transition-all outline-none"
                    >
                        <span className="flex items-center gap-2"><Settings2 className="w-4 h-4"/> Console</span>
                        <span>{isMenuOpen ? '−' : '+'}</span>
                    </button>

                    {isMenuOpen && (
                        <div className="bg-black/90 backdrop-blur-xl border border-sgxBlue rounded-xl p-3 shadow-2xl max-h-[60vh] overflow-y-auto no-scrollbar pointer-events-auto">
                            <div className="grid grid-cols-4 gap-1 mb-3">
                                {['comic', 'manga', 'cyberpunk', 'acid'].map(key => (
                                    <button key={key} onClick={() => setParams(prev => ({...prev, ...presets[key]}))} className={`text-black font-black text-[8px] uppercase py-1.5 rounded hover:opacity-80 transition-all ${key === 'comic' ? 'bg-sgxYellow' : key === 'manga' ? 'bg-white' : key === 'cyberpunk' ? 'bg-sgxNeon' : 'bg-sgxMagenta text-white'}`}>{key}</button>
                                ))}
                            </div>

                            <div className="space-y-4">
                                <div className="bg-gray-900/50 p-2 rounded-lg border border-gray-800">
                                    <div className="text-white text-[9px] font-black uppercase tracking-widest mb-2 flex items-center gap-1"><Palette className="w-3 h-3 text-sgxYellow"/> Color & Tinta</div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="col-span-2">
                                            <div className="flex justify-between text-gray-300 text-[8px] font-bold uppercase mb-1"><span>Matiz (Hue)</span><span>{params.hue.toFixed(2)}</span></div>
                                            <input type="range" min="0" max="6.28" step="0.01" value={params.hue} onChange={(e) => updateParam('hue', e.target.value)} />
                                        </div>
                                        <div><div className="text-gray-300 text-[8px] font-bold uppercase mb-1">Saturación</div><input type="range" min="0" max="4" step="0.1" value={params.saturation} onChange={(e) => updateParam('saturation', e.target.value)} /></div>
                                        <div><div className="text-gray-300 text-[8px] font-bold uppercase mb-1">Grosor Tinta</div><input type="range" min="0" max="1" step="0.05" value={params.inkThickness} onChange={(e) => updateParam('inkThickness', e.target.value)} /></div>
                                        <div><div className="text-gray-300 text-[8px] font-bold uppercase mb-1">Brillo</div><input type="range" min="0.1" max="2.5" step="0.1" value={params.brightness} onChange={(e) => updateParam('brightness', e.target.value)} /></div>
                                        <div><div className="text-gray-300 text-[8px] font-bold uppercase mb-1">Contraste</div><input type="range" min="0.1" max="3.0" step="0.1" value={params.contrast} onChange={(e) => updateParam('contrast', e.target.value)} /></div>
                                    </div>
                                </div>

                                <div className="bg-gray-900/50 p-2 rounded-lg border border-gray-800">
                                    <div className="text-white text-[9px] font-black uppercase tracking-widest mb-2 flex items-center gap-1"><Grid className="w-3 h-3 text-sgxNeon"/> Trama & Grano</div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="col-span-2">
                                            <div className="flex justify-between text-gray-300 text-[8px] font-bold uppercase mb-1"><span>Trama Halftone</span><span>{(params.dotIntensity * 100).toFixed(0)}%</span></div>
                                            <input type="range" min="0" max="1" step="0.05" value={params.dotIntensity} onChange={(e) => updateParam('dotIntensity', e.target.value)} />
                                        </div>
                                        <div><div className="text-gray-300 text-[8px] font-bold uppercase mb-1">Escala Puntos</div><input type="range" min="20" max="250" step="5" value={params.dotScale} onChange={(e) => updateParam('dotScale', e.target.value)} /></div>
                                        <div><div className="text-gray-300 text-[8px] font-bold uppercase mb-1">Ruido Film</div><input type="range" min="0" max="0.5" step="0.01" value={params.noise} onChange={(e) => updateParam('noise', e.target.value)} /></div>
                                    </div>
                                </div>

                                <div className="bg-gray-900/50 p-2 rounded-lg border border-gray-800">
                                    <div className="text-white text-[9px] font-black uppercase tracking-widest mb-2 flex items-center gap-1"><Zap className="w-3 h-3 text-red-500"/> VFX Glitch</div>
                                    <div className="grid grid-cols-1 gap-3">
                                        <div><div className="flex justify-between text-red-400 text-[8px] font-bold uppercase mb-1"><span>Desgarre</span><span>{(params.glitchTearing * 100).toFixed(0)}%</span></div><input type="range" min="0" max="3" step="0.05" value={params.glitchTearing} onChange={(e) => updateParam('glitchTearing', e.target.value)} /></div>
                                        <div><div className="flex justify-between text-blue-400 text-[8px] font-bold uppercase mb-1"><span>Aberración RGB</span><span>{params.aberration.toFixed(1)}</span></div><input type="range" min="0" max="5" step="0.1" value={params.aberration} onChange={(e) => updateParam('aberration', e.target.value)} /></div>
                                        <div><div className="flex justify-between text-green-400 text-[8px] font-bold uppercase mb-1"><span className="flex items-center gap-1"><MonitorPlay className="w-3 h-3"/> CRT Scanlines</span><span>{(params.scanlines * 100).toFixed(0)}%</span></div><input type="range" min="0" max="2" step="0.05" value={params.scanlines} onChange={(e) => updateParam('scanlines', e.target.value)} /></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    }
    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
