<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGX Story VisGen | Ultra Core v5 (Audio + Upload Fix)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          colors: {
            sgxBlue: '#32527B',
            sgxYellow: '#FDCC0D',
            sgxCopper: '#B87333',
            sgxNeon: '#00ffff',
            sgxMagenta: '#ff00ff'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } 
        } 
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; color: white; user-select: none; }
    #root { width: 100%; height: 100%; }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #FDCC0D; cursor: pointer; margin-top: -4px; box-shadow: 0 0 6px rgba(253,204,13,0.8); }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #32527B; border-radius: 2px; }
    
    @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
    .comic-font { font-family: 'Bangers', cursive; letter-spacing: 2px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
        "lucide-react": "https://esm.sh/lucide-react@0.303.0?external=react"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useEffect, useRef, useState, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as THREE from 'three';
    import { Canvas, useFrame, useThree } from '@react-three/fiber';
    import { Settings2, Camera, PaintBucket, Grid, Scissors, Layers, Upload, Video, Square, Zap, Scan, MonitorPlay, Palette } from 'lucide-react';

    // ==========================================
    // SHADER ENGINE (SGX.Story Core - V5)
    // ==========================================
    const ComicBackground = ({ mediaSource, isCamera, shaderParams }) => {
        const { size } = useThree();
        const materialRef = useRef();
        const [texture, setTexture] = useState(null);

        // FIX DE MEMORIA Y UPLOAD: Manejo estricto de Texturas según el TagName
        useEffect(() => {
            if (!mediaSource) return;
            
            let tex;
            if (mediaSource.tagName.toUpperCase() === 'VIDEO') {
                tex = new THREE.VideoTexture(mediaSource);
            } else if (mediaSource.tagName.toUpperCase() === 'IMG') {
                tex = new THREE.Texture(mediaSource);
                tex.needsUpdate = true; // Fundamental para imágenes estáticas
            }
            
            if (tex) {
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                setTexture(tex);
            }

            // Garbage Collection para evitar freezes al cambiar de upload a cámara
            return () => {
                if (tex) tex.dispose();
            };
        }, [mediaSource]);

        const uniforms = useMemo(() => ({
            tDiffuse: { value: null },
            uResolution: { value: new THREE.Vector2(1, 1) },
            uMirror: { value: isCamera ? 1.0 : 0.0 },
            uTime: { value: 0.0 },
            uEdgeThreshold: { value: 0.15 },
            uColorSteps: { value: 5.0 },
            uSaturation: { value: 1.5 },
            uHue: { value: 0.0 }, 
            uDotScale: { value: 80.0 },
            uDotIntensity: { value: 0.5 },
            uBrightness: { value: 1.0 },
            uContrast: { value: 1.0 },
            uNoise: { value: 0.0 },
            uAberration: { value: 0.0 },
            uGlitchTearing: { value: 0.0 },
            uScanlines: { value: 0.0 }
        }), [isCamera]);

        useEffect(() => {
            if (texture) uniforms.tDiffuse.value = texture;
            uniforms.uMirror.value = isCamera ? 1.0 : 0.0;
        }, [texture, uniforms, isCamera]);

        useFrame(({ clock }) => {
            if (materialRef.current) {
                const u = materialRef.current.uniforms;
                u.uTime.value = clock.getElapsedTime();
                u.uResolution.value.set(size.width, size.height);
                u.uEdgeThreshold.value = 0.4 - (shaderParams.inkThickness * 0.35); 
                u.uColorSteps.value = shaderParams.colorSteps;
                u.uSaturation.value = shaderParams.saturation;
                u.uHue.value = shaderParams.hue;
                u.uDotScale.value = shaderParams.dotScale;
                u.uDotIntensity.value = shaderParams.dotIntensity;
                u.uBrightness.value = shaderParams.brightness;
                u.uContrast.value = shaderParams.contrast;
                u.uNoise.value = shaderParams.noise;
                u.uAberration.value = shaderParams.aberration;
                u.uGlitchTearing.value = shaderParams.glitchTearing;
                u.uScanlines.value = shaderParams.scanlines;
            }
        });

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform sampler2D tDiffuse;
            uniform vec2 uResolution;
            uniform float uMirror;
            uniform float uTime;
            
            uniform float uEdgeThreshold;
            uniform float uColorSteps;
            uniform float uSaturation;
            uniform float uHue;
            uniform float uDotScale;
            uniform float uDotIntensity;
            uniform float uBrightness;
            uniform float uContrast;
            uniform float uNoise;
            uniform float uAberration;
            uniform float uGlitchTearing;
            uniform float uScanlines;

            varying vec2 vUv;

            float getLuma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
            float rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }

            vec3 applyHue(vec3 color, float hue) {
                const vec3 k = vec3(0.57735, 0.57735, 0.57735);
                float cosAngle = cos(hue);
                return color * cosAngle + cross(k, color) * sin(hue) + k * dot(k, color) * (1.0 - cosAngle);
            }

            void main() {
                vec2 uv = vUv;
                if(uMirror > 0.5) { uv.x = 1.0 - uv.x; }

                float glitchOffset = 0.0;
                if (uGlitchTearing > 0.0) {
                    float gTime = uTime * 15.0;
                    float band = step(0.9, sin(uv.y * 10.0 + gTime) * cos(uv.y * 25.0 - gTime));
                    glitchOffset = band * (rand(vec2(gTime, uv.y)) - 0.5) * 0.1 * uGlitchTearing;
                }
                vec2 baseUv = uv + vec2(glitchOffset, 0.0);

                vec2 rUv = baseUv + vec2(uAberration * 0.01, 0.0);
                vec2 gUv = baseUv;
                vec2 bUv = baseUv - vec2(uAberration * 0.01, 0.0);

                vec3 color;
                color.r = texture2D(tDiffuse, rUv).r;
                color.g = texture2D(tDiffuse, gUv).g;
                color.b = texture2D(tDiffuse, bUv).b;
                
                color = (color - 0.5) * uContrast + 0.5;
                color *= uBrightness;
                
                float luma = getLuma(color);
                vec3 lumaVec = vec3(luma);
                
                color = mix(lumaVec, color, uSaturation);
                color = applyHue(color, uHue);

                vec2 texel = 1.0 / uResolution;
                float s00 = getLuma(texture2D(tDiffuse, baseUv + texel * vec2(-1.0, -1.0)).rgb);
                float s22 = getLuma(texture2D(tDiffuse, baseUv + texel * vec2(1.0, 1.0)).rgb);
                float s02 = getLuma(texture2D(tDiffuse, baseUv + texel * vec2(-1.0, 1.0)).rgb);
                float s20 = getLuma(texture2D(tDiffuse, baseUv + texel * vec2(1.0, -1.0)).rgb);
                
                float edge = abs(s00 - s22) + abs(s02 - s20);
                float isEdge = smoothstep(uEdgeThreshold - 0.05, uEdgeThreshold, edge);

                vec3 postColor = floor(color * uColorSteps) / uColorSteps;

                vec2 aspectUv = baseUv;
                aspectUv.x *= uResolution.x / uResolution.y; 
                vec2 gridUv = aspectUv * uDotScale; 
                vec2 cellCenter = fract(gridUv) - 0.5;
                float dotDist = length(cellCenter);
                
                float radius = (1.0 - luma) * 0.7; 
                float dotMask = smoothstep(radius, radius + 0.1, dotDist);
                vec3 dotColor = vec3(0.05, 0.05, 0.1);

                float n = (rand(baseUv + uTime) - 0.5) * uNoise;
                float scanline = sin(uv.y * uResolution.y * 1.5) * 0.04 * uScanlines;

                vec3 finalColor = postColor + n - scanline;
                finalColor = mix(mix(dotColor, finalColor, dotMask), finalColor, 1.0 - uDotIntensity);
                finalColor = mix(finalColor, vec3(0.02), isEdge); 

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        if (!texture) return null;

        return (
            <mesh renderOrder={-1} frustumCulled={false}>
                <planeGeometry args={[2, 2]} />
                <shaderMaterial 
                    ref={materialRef}
                    vertexShader={vertexShader}
                    fragmentShader={fragmentShader}
                    uniforms={uniforms}
                    depthWrite={false}
                    depthTest={false}
                />
            </mesh>
        );
    };

    // ==========================================
    // SGX MASTER INTERFACE (Audio + Video Muxing)
    // ==========================================
    function App() {
        const fileInputRef = useRef(null);
        const hiddenVideoRef = useRef(null);
        const hiddenImageRef = useRef(null);
        
        // Refs de Streaming Críticos
        const activeStreamRef = useRef(null);
        const audioStreamRef = useRef(null); // Captura el audio del Micrófono puro
        
        const [mediaSource, setMediaSource] = useState(null);
        const [isCamera, setIsCamera] = useState(true);
        const [isMenuOpen, setIsMenuOpen] = useState(true);
        
        const [isRecording, setIsRecording] = useState(false);
        const mediaRecorderRef = useRef(null);
        const recordedChunks = useRef([]);
        const [videoExtension, setVideoExtension] = useState('mp4');
        
        const [params, setParams] = useState({
            inkThickness: 0.8,
            colorSteps: 5.0,      
            saturation: 1.5,      
            hue: 0.0, 
            dotScale: 120.0,      
            dotIntensity: 0.4,
            brightness: 1.0,
            contrast: 1.2,
            noise: 0.1,
            aberration: 0.0,
            glitchTearing: 0.0,
            scanlines: 0.0
        });

        const presets = {
            comic: { inkThickness: 0.8, colorSteps: 5.0, saturation: 1.5, hue: 0.0, dotScale: 120.0, dotIntensity: 0.4, brightness: 1.0, contrast: 1.2, noise: 0.1, aberration: 0.0, glitchTearing: 0.0, scanlines: 0.0 },
            manga: { inkThickness: 0.9, colorSteps: 2.0, saturation: 0.0, hue: 0.0, dotScale: 150.0, dotIntensity: 0.8, brightness: 1.2, contrast: 1.5, noise: 0.2, aberration: 0.5, glitchTearing: 0.0, scanlines: 0.2 },
            cyberpunk: { inkThickness: 0.7, colorSteps: 8.0, saturation: 2.5, hue: 0.5, dotScale: 60.0, dotIntensity: 0.2, brightness: 0.9, contrast: 1.4, noise: 0.05, aberration: 2.0, glitchTearing: 0.8, scanlines: 1.0 },
            acid: { inkThickness: 0.4, colorSteps: 3.0, saturation: 3.0, hue: 3.14, dotScale: 40.0, dotIntensity: 0.6, brightness: 1.2, contrast: 2.0, noise: 0.3, aberration: 3.5, glitchTearing: 1.5, scanlines: 0.0 },
            raw: { inkThickness: 0.0, colorSteps: 15.0, saturation: 1.0, hue: 0.0, dotScale: 1.0, dotIntensity: 0.0, brightness: 1.0, contrast: 1.0, noise: 0.0, aberration: 0.0, glitchTearing: 0.0, scanlines: 0.0 }
        };

        const applyPreset = (key) => setParams(prev => ({ ...prev, ...presets[key] }));
        const updateParam = (key, value) => setParams(prev => ({ ...prev, [key]: Number(value) }));

        // INICIALIZACIÓN CON MICRÓFONO
        const startCamera = async () => {
            if (activeStreamRef.current) {
                activeStreamRef.current.getTracks().forEach(t => t.stop());
            }

            if (navigator.mediaDevices) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "user" },
                        audio: { echoCancellation: true, noiseSuppression: true } 
                    });
                    
                    activeStreamRef.current = stream;
                    
                    // Extraer y aislar la pista de audio para la mezcla final
                    if (stream.getAudioTracks().length > 0) {
                        audioStreamRef.current = new MediaStream([stream.getAudioTracks()[0]]);
                    }

                    if(hiddenVideoRef.current) {
                        hiddenVideoRef.current.srcObject = stream;
                        hiddenVideoRef.current.onloadedmetadata = () => {
                            hiddenVideoRef.current.play();
                            setMediaSource(hiddenVideoRef.current);
                            setIsCamera(true);
                        };
                    }
                } catch (e) { console.error("Camera SGX Error:", e); }
            }
        };

        useEffect(() => { startCamera(); }, []);

        // FIX DE UPLOAD Y LIMPIEZA DE DOM
        const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            
            // Apagar la cámara si está encendida para liberar memoria/micrófono
            if (activeStreamRef.current) {
                activeStreamRef.current.getTracks().forEach(t => t.stop());
                activeStreamRef.current = null;
                audioStreamRef.current = null; 
            }

            if (file.type.startsWith('video/')) {
                if(hiddenVideoRef.current) {
                    hiddenVideoRef.current.srcObject = null;
                    hiddenVideoRef.current.src = url;
                    hiddenVideoRef.current.loop = true;
                    // Se mantiene muteado en el DOM para permitir autoplay sin interacción,
                    // pero el captureStream extraerá el audio original.
                    hiddenVideoRef.current.muted = true; 
                    hiddenVideoRef.current.onloadedmetadata = () => {
                        hiddenVideoRef.current.play();
                        setMediaSource(hiddenVideoRef.current);
                        setIsCamera(false);
                    };
                }
            } else if (file.type.startsWith('image/')) {
                if(hiddenImageRef.current) {
                    hiddenImageRef.current.onload = () => {
                        setMediaSource(hiddenImageRef.current);
                        setIsCamera(false);
                    };
                    hiddenImageRef.current.src = url;
                }
            }
        };

        const takeSnapshot = () => {
            const canvas = document.querySelector('canvas');
            if(!canvas) return;
            const dataUrl = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `SGX_VisGen_${Date.now()}.png`;
            link.href = dataUrl;
            link.click();
        };

        // FUSIÓN DE AUDIO Y VIDEO + MP4 FALLBACK
        const toggleRecording = () => {
            const canvas = document.querySelector('canvas');
            if(!canvas) return;

            if (!isRecording) {
                recordedChunks.current = [];
                const canvasStream = canvas.captureStream(30); // 30 FPS para estabilizar
                
                let combinedStream = canvasStream;
                let finalAudioStream = null;

                // 1. Decidir de dónde sacamos el audio (Micro o Video Subido)
                if (isCamera && audioStreamRef.current) {
                    finalAudioStream = audioStreamRef.current;
                } else if (!isCamera && hiddenVideoRef.current) {
                    // Intento de capturar audio del video subido aunque esté muteado en el DOM
                    try {
                        const vidStream = hiddenVideoRef.current.captureStream ? hiddenVideoRef.current.captureStream() : hiddenVideoRef.current.mozCaptureStream();
                        if (vidStream && vidStream.getAudioTracks().length > 0) {
                            finalAudioStream = new MediaStream([vidStream.getAudioTracks()[0]]);
                        }
                    } catch(e) { console.warn("No audio track in uploaded video", e); }
                }

                // 2. Fusionar los Tracks
                if (finalAudioStream && finalAudioStream.getAudioTracks().length > 0) {
                    combinedStream = new MediaStream([
                        ...canvasStream.getVideoTracks(),
                        ...finalAudioStream.getAudioTracks()
                    ]);
                }

                // 3. Lógica de Fallback MP4 (El "Truco Sucio")
                let mimeType = 'video/mp4'; 
                let fileExt = 'mp4';
                
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/webm; codecs=vp9,opus'; 
                    fileExt = 'mp4'; // Forzar extensión a nivel de archivo
                    if (!MediaRecorder.isTypeSupported(mimeType)) {
                        mimeType = 'video/webm'; 
                    }
                }
                setVideoExtension(fileExt);

                mediaRecorderRef.current = new MediaRecorder(combinedStream, { mimeType: mimeType });
                
                mediaRecorderRef.current.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.current.push(event.data);
                };
                
                mediaRecorderRef.current.onstop = () => {
                    const blob = new Blob(recordedChunks.current, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = `SGX_VisGen_${Date.now()}.${fileExt}`;
                    link.href = url;
                    link.click();
                    setTimeout(() => window.URL.revokeObjectURL(url), 100);
                };
                
                mediaRecorderRef.current.start();
                setIsRecording(true);
            } else {
                mediaRecorderRef.current.stop();
                setIsRecording(false);
            }
        };

        return (
            <div className="relative w-full h-screen bg-[#050505] overflow-hidden font-sans">
                <video ref={hiddenVideoRef} className="hidden" playsInline muted crossOrigin="anonymous" />
                <img ref={hiddenImageRef} className="hidden" crossOrigin="anonymous" />
                <input type="file" ref={fileInputRef} className="hidden" accept="image/*,video/*" onChange={handleFileUpload} />
                
                <div className="absolute inset-0 z-0">
                    <Canvas gl={{ preserveDrawingBuffer: true, antialias: false, toneMapping: THREE.NoToneMapping }}>
                        <ComicBackground mediaSource={mediaSource} isCamera={isCamera} shaderParams={params} />
                    </Canvas>
                </div>

                {/* HEADER UI */}
                <div className="absolute top-6 left-6 z-20 flex flex-col md:flex-row items-start md:items-center gap-4 pointer-events-none">
                    <div className="flex items-center gap-3 bg-white p-3 border-4 border-black rounded-xl shadow-[4px_4px_0px_0px_#32527B] transform -rotate-1 pointer-events-auto">
                        <Layers className="text-black w-5 h-5" />
                        <div>
                            <h1 className="text-xl text-black comic-font leading-none uppercase">SGX <span className="text-[#B87333]">VisGen</span></h1>
                        </div>
                    </div>
                </div>

                {/* ACCIONES SUPERIORES DERECHAS */}
                <div className="absolute top-6 right-6 z-20 flex gap-3">
                    <button onClick={() => fileInputRef.current?.click()} className="bg-black/80 backdrop-blur border border-sgxBlue text-white p-3 rounded-full hover:bg-sgxBlue transition shadow-[0_0_15px_rgba(50,82,123,0.5)]">
                        <Upload className="w-5 h-5" />
                    </button>
                    { !isCamera && (
                        <button onClick={startCamera} className="bg-black/80 backdrop-blur border border-sgxYellow text-white p-3 rounded-full hover:bg-sgxYellow hover:text-black transition shadow-[0_0_15px_rgba(253,204,13,0.5)]">
                            <Camera className="w-5 h-5" />
                        </button>
                    )}
                </div>

                {/* CAPTURA BOTTOM CENTER (PRO ICONS) */}
                <div className="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-30 flex items-center gap-4">
                    <button onClick={takeSnapshot} className="bg-white text-black p-4 rounded-full hover:scale-105 transition shadow-[0_0_15px_rgba(255,255,255,0.4)]">
                        <Camera className="w-6 h-6" />
                    </button>
                    <button onClick={toggleRecording} className={`p-4 rounded-full transition shadow-[0_0_15px_rgba(255,0,255,0.4)] ${isRecording ? 'bg-red-600 text-white animate-pulse' : 'bg-sgxMagenta text-white hover:bg-fuchsia-600 hover:scale-105'}`}>
                        {isRecording ? <Square className="w-6 h-6 fill-current" /> : <Video className="w-6 h-6 fill-current" />} 
                    </button>
                </div>

                {/* PANEL DE CONTROL MULTIMODULAR */}
                <div className="absolute bottom-24 left-6 md:top-24 md:left-6 md:bottom-auto w-[calc(100%-3rem)] md:w-72 z-20 flex flex-col gap-2">
                    <button 
                        onClick={() => setIsMenuOpen(!isMenuOpen)}
                        className="flex items-center justify-between bg-sgxYellow text-black border-2 border-black rounded-xl px-4 py-2 font-black uppercase text-sm tracking-widest shadow-[4px_4px_0px_0px_#B87333] hover:translate-y-1 hover:shadow-[0px_0px_0px_0px_#B87333] transition-all"
                    >
                        <span className="flex items-center gap-2"><Settings2 className="w-4 h-4"/> Console</span>
                        <span>{isMenuOpen ? '−' : '+'}</span>
                    </button>

                    {isMenuOpen && (
                        <div className="bg-black/90 backdrop-blur-xl border border-sgxBlue rounded-xl p-3 shadow-[0_0_20px_rgba(50,82,123,0.3)] max-h-[55vh] overflow-y-auto no-scrollbar">
                            
                            <div className="grid grid-cols-4 gap-1 mb-4">
                                <button onClick={() => applyPreset('comic')} className="bg-sgxYellow text-black font-black text-[9px] uppercase py-1.5 rounded hover:bg-yellow-400">Comic</button>
                                <button onClick={() => applyPreset('manga')} className="bg-white text-black font-black text-[9px] uppercase py-1.5 rounded hover:bg-gray-200">Manga</button>
                                <button onClick={() => applyPreset('cyberpunk')} className="bg-sgxNeon text-black font-black text-[9px] uppercase py-1.5 rounded hover:bg-cyan-300">Neon</button>
                                <button onClick={() => applyPreset('acid')} className="bg-sgxMagenta text-white font-black text-[9px] uppercase py-1.5 rounded hover:bg-fuchsia-600">Acid</button>
                            </div>

                            <div className="space-y-3">
                                <div>
                                    <div className="flex justify-between text-red-500 text-[9px] font-bold uppercase mb-1">
                                        <span className="flex items-center gap-1"><Zap className="w-3 h-3"/> Glitch</span>
                                        <span>{(params.glitchTearing * 100).toFixed(0)}%</span>
                                    </div>
                                    <input type="range" min="0" max="3" step="0.05" value={params.glitchTearing} onChange={(e) => updateParam('glitchTearing', e.target.value)} />
                                </div>

                                <div>
                                    <div className="flex justify-between text-blue-400 text-[9px] font-bold uppercase mb-1">
                                        <span className="flex items-center gap-1"><Scan className="w-3 h-3"/> Aberración RGB</span>
                                        <span>{params.aberration.toFixed(1)}</span>
                                    </div>
                                    <input type="range" min="0" max="5" step="0.1" value={params.aberration} onChange={(e) => updateParam('aberration', e.target.value)} />
                                </div>

                                <hr className="border-gray-800 my-1" />

                                <div>
                                    <div className="flex justify-between text-gray-300 text-[9px] font-bold uppercase mb-1">
                                        <span className="flex items-center gap-1"><Scissors className="w-3 h-3"/> Grosor Tinta</span>
                                        <span>{(params.inkThickness * 100).toFixed(0)}%</span>
                                    </div>
                                    <input type="range" min="0" max="1" step="0.05" value={params.inkThickness} onChange={(e) => updateParam('inkThickness', e.target.value)} />
                                </div>

                                <div>
                                    <div className="flex justify-between text-sgxMagenta text-[9px] font-bold uppercase mb-1">
                                        <span className="flex items-center gap-1"><Layers className="w-3 h-3"/> Posterización</span>
                                        <span>{params.colorSteps} Fases</span>
                                    </div>
                                    <input type="range" min="2" max="20" step="1" value={params.colorSteps} onChange={(e) => updateParam('colorSteps', e.target.value)} />
                                </div>

                                <div>
                                    <div className="flex justify-between text-sgxYellow text-[9px] font-bold uppercase mb-1">
                                        <span className="flex items-center gap-1"><PaintBucket className="w-3 h-3"/> Saturación</span>
                                        <span>{params.saturation.toFixed(1)}x</span>
                                    </div>
                                    <input type="range" min="0" max="4" step="0.1" value={params.saturation} onChange={(e) => updateParam('saturation', e.target.value)} />
                                </div>

                                <div>
                                    <div className="flex justify-between text-sgxNeon text-[9px] font-bold uppercase mb-1">
                                        <span className="flex items-center gap-1"><Grid className="w-3 h-3"/> Trama de Puntos</span>
                                        <span>{(params.dotIntensity * 100).toFixed(0)}%</span>
                                    </div>
                                    <input type="range" min="0" max="1" step="0.05" value={params.dotIntensity} onChange={(e) => updateParam('dotIntensity', e.target.value)} />
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <div className="text-white text-[9px] font-bold uppercase mb-1">Brillo</div>
                                        <input type="range" min="0.1" max="2.5" step="0.1" value={params.brightness} onChange={(e) => updateParam('brightness', e.target.value)} />
                                    </div>
                                    <div>
                                        <div className="text-white text-[9px] font-bold uppercase mb-1">Contraste</div>
                                        <input type="range" min="0.1" max="3.0" step="0.1" value={params.contrast} onChange={(e) => updateParam('contrast', e.target.value)} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    }
    
    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
